# Run from the repo root:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
# Without --env-file, the defaults below apply (local and CI use only).

name: claims-pilot

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claims}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/claims
      MOCK_CORE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claims}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/mock_core
      # The Http core clients call this app's own /mock-core router.
      MOCK_CORE_BASE_URL: ${MOCK_CORE_BASE_URL:-http://127.0.0.1:8000/mock-core}
      FILE_STORE_DIR: /data/files
      # The default is a LOCAL-ONLY dev key (base64 of a fixed 32-byte string). It protects
      # nothing. On the server, set FILE_ENCRYPTION_KEY in .env (see .env.example).
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-bG9jYWwtZGV2LW9ubHktbm90LWEtcmVhbC1rZXktMDA=}
      # Empty by default: model calls fail with a clear error until a key is set.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-claims}
      # Letters by email: off by default (shadow mode, letters are only recorded). When on,
      # Microsoft Graph sends only to the comma-separated addresses in the allowlist.
      NOTIFICATIONS_GRAPH_ENABLED: ${NOTIFICATIONS_GRAPH_ENABLED:-false}
      NOTIFICATION_ALLOWLIST: ${NOTIFICATION_ALLOWLIST:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}
      GRAPH_ACCESS_TOKEN: ${GRAPH_ACCESS_TOKEN:-}
    volumes:
      - file-store:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # urlopen raises on 503, so the container is healthy only when /health is 200.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      # Explicit, so the init script can create "claims" without a name clash.
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during first-boot init only the socket is open,
      # so a socket check would pass before the init script has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d claims"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-local-dev-only}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Passes once the server is up and the default namespace exists.
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  temporal-ui:
    image: temporalio/ui:2.58.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      # Localhost only: reach it through an SSH tunnel.
      - "127.0.0.1:8080:8080"
    depends_on:
      - temporal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    image: caddy:2.11.9
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres-data:
  file-store:
  caddy-data:
  caddy-config:
