# Local development only. Publishes the app on 127.0.0.1:8000, so host tools (the live
# acceptance run, the Vite dev server proxy, curl) reach it without Caddy's self-signed TLS.
# Never use this file on the server: production goes through Caddy on 80 and 443 only.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d --build

services:
  app:
    ports:
      - "127.0.0.1:8000:8000"
