# Maps each model role to a provider and model. Switching provider or model is a change here.
# Phase 1 tracer: every role uses one vision-capable OpenRouter model (a placeholder until the
# Phase 3 evals pick a model per role).

providers:
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    # Name of the environment variable that holds the key. The key itself is never stored here.
    api_key_env: OPENROUTER_API_KEY

roles:
  vision_classify:
    provider: openrouter
    model: google/gemini-2.5-flash
    params: {temperature: 0}
  vision_extract:
    provider: openrouter
    model: google/gemini-2.5-flash
    params: {temperature: 0}
  reasoning:
    provider: openrouter
    model: google/gemini-2.5-flash
    params: {temperature: 0}
  fast_text:
    provider: openrouter
    model: google/gemini-2.5-flash
    params: {temperature: 0}
