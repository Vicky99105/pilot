# Product parameters for the rules engine. One file per product version.
# The rules read every limit from here; changing a limit is a change to this file only.
# Clause references match the policy_clauses seed (backend/app/database/seed.py).

product_uin: PLACEHOLDER-AROGYA-SANJEEVANI-UIN
name: Arogya Sanjeevani style standard product (pilot)
version: 1
# The filed wording the limits below are checked against when the policy_wording loader runs
# (python -m app.knowledge.load policy_wording): Go Digit's Arogya Sanjeevani wording.
wording_uin: GODHLIP24179V022324

room_rent:
  percent_of_sum_insured: 2
  max_per_day: 5000
icu:
  percent_of_sum_insured: 5
  max_per_day: 10000

proportionate_deduction:
  # Heads reduced in the ratio (room cap / room rate charged) when the room breaches its cap.
  linked_heads: [nursing, ot, professional_fees]
  # Heads that are never reduced in proportion.
  excluded_heads: [pharmacy, consumables, implants, diagnostics]
  # When the hospital charges the same rates for every room category, no deduction applies.
  only_with_differential_billing: true

co_pay:
  percent: 5

initial_waiting:
  days: 30
  accident_exempt: true
  # Continuous cover longer than this many months waives the initial wait.
  waived_after_continuous_cover_months: 12

grace_period_days:
  monthly: 15
  other: 30

# Sub-limits and windows, each checked against the wording (section C.I).
sub_limits:
  cataract:
    percent_of_sum_insured: 25
    max_per_eye: 40000
  modern_treatments_percent_of_sum_insured: 50
  ambulance_max_per_hospitalisation: 2000
pre_hospitalisation_days: 30
post_hospitalisation_days: 60
pre_existing_waiting_months: 36

# Excl02: the wording's specified conditions, in its order, with ICD ranges. Ranges follow
# KnowledgeBase.code_in_ranges: one code covers the codes below it; "A-B" covers both ends
# and everything between. Mapping is conservative: a condition too broad or vague for an ICD
# grouping, or a procedure that ICD-10-CM does not code, says so in `unmapped` instead of
# guessing. Procedures carry ICD-10-PCS table prefixes (FY2027) instead.
specific_waiting:
  clause: Excl02
  accident_exempt: true
  conditions:
    - item: Benign ENT disorders
      months: 24
      unmapped: no ICD-10-CM grouping matches "benign ENT disorders"; too broad to map
    - item: Tonsillectomy
      months: 24
      icd10pcs: [0CTP]  # resection of tonsils
      unmapped: a procedure; ICD-10-CM does not code it
    - item: Adenoidectomy
      months: 24
      icd10pcs: [0CTQ]  # resection of adenoids
      unmapped: a procedure; ICD-10-CM does not code it
    - item: Mastoidectomy
      months: 24
      icd10pcs: [09TB, 09TC]  # resection of the right or left mastoid sinus
      unmapped: a procedure; ICD-10-CM does not code it
    - item: Tympanoplasty
      months: 24
      icd10pcs: [09Q7, 09Q8, 09R7, 09R8]  # repair or replacement of a tympanic membrane
      unmapped: a procedure; ICD-10-CM does not code it
    - item: Hysterectomy
      months: 24
      icd10pcs: [0UT9]  # resection of uterus
      unmapped: a procedure; ICD-10-CM does not code it
    - item: All internal and external benign tumours, cysts, polyps of any kind, including benign breast lumps
      months: 24
      # benign neoplasms; breast dysplasia and lumps; nasal, gastric, anal, rectal, colon and
      # female genital polyps
      icd10cm: [D10-D36, N60, N63, J33, K31.7, K62.0, K62.1, K63.5, N84]
      unmapped: cysts are spread across every chapter with no common grouping; not mapped
    - item: Benign prostate hypertrophy
      months: 24
      icd10cm: [N40]
    - item: Cataract and age-related eye ailments
      months: 24
      icd10cm: [H25, H26, H28]
      unmapped: '"age-related eye ailments" other than cataract are not a defined grouping'
    - item: Gastric/ Duodenal Ulcer
      months: 24
      icd10cm: [K25-K27]  # gastric, duodenal, and peptic ulcer of unspecified site
    - item: Gout and Rheumatism
      months: 24
      icd10cm: [M10, M1A, M79.0]
    - item: Hernia of all types
      months: 24
      icd10cm: [K40-K46]
    - item: Hydrocele
      months: 24
      icd10cm: [N43.0-N43.3, P83.5]  # N43.4 is spermatocele, not hydrocele
    - item: Non-Infective Arthritis
      months: 24
      # inflammatory polyarthropathies; osteoarthritis (M15-M19) sits under the 36-month item
      icd10cm: [M05-M14]
    - item: Piles, Fissures and Fistula in anus
      months: 24
      icd10cm: [K60, K64]
    - item: Pilonidal sinus, Sinusitis and related disorders
      months: 24
      icd10cm: [L05, J01, J32]
      unmapped: '"related disorders" is not defined; not mapped'
    - item: Prolapse inter Vertebral Disc and Spinal Diseases unless arising from accident
      months: 24
      icd10cm: [M40-M54]  # dorsopathies, including disc disorders M50-M51
    - item: Calculi in urinary system, Gall Bladder and Bile duct, excluding malignancy.
      months: 24
      icd10cm: [N20-N22, K80]  # N23 is renal colic, not a calculus
    - item: Varicose Veins and Varicose Ulcers
      months: 24
      icd10cm: [I83]  # I86 (other sites) includes gastric varices; left out
    - item: Treatment for joint replacement unless arising from accident
      months: 36
      icd10pcs: [0SR, 0RR]  # replacement of lower and upper joints
      unmapped: a procedure; ICD-10-CM does not code it
    - item: Age-related Osteoarthritis & Osteoporosis
      months: 36
      icd10cm: [M15-M19, M80-M81]

# Package-first bill review. A hospital agreement names the scheme its packages are priced
# from; these settings say how the product pays them.
packages:
  # The hospital agreement binds the hospital on cashless claims only. This wording (Go Digit)
  # has no clause capping a reimbursement at the network package rate, so a reimbursement is
  # paid on the policy's own limits. A wording with such a clause (New India 3.31) lists
  # [cashless, reimbursement].
  pricing_applies_to: [cashless]
  # What a package price covers on an itemised bill. The CGHS package definition covers
  # accommodation, nursing, OT, surgeon and anaesthetist fees, medicines, surgical
  # disposables and related routine investigations; implants are paid outside it.
  included_heads: [room, icu, nursing, ot, professional_fees, pharmacy, consumables, diagnostics]
  # Several procedures in one admission (CGHS OM 03.10.2025 Annexure I): the highest-rated
  # at 100%, the second at 50%, the rest at 25% each. Add-on packages are paid in full.
  multi_procedure_percent: {first: 100, second: 50, rest: 25, addon: 100}
  # R24: the agreed non-package discount never applies to medicines or implants.
  discount_excluded_heads: [pharmacy, implants]

# R12: a model reading of an unclear line below this confidence goes to a person.
non_payable_judging:
  min_confidence: 0.8

# NPPA ceiling prices exclude GST. Assumption: medicines carry 12% GST (the common rate for
# scheduled formulations); a line is above the ceiling only above ceiling plus GST.
drug_price:
  gst_percent: 12

# R16: cataract surgery, ICD-10-PCS (FY2027) prefixes: extraction of the right or left lens
# and replacement of the right or left lens. The 4th character (J right, K left) is the eye.
cataract_pcs: [08DJ, 08DK, 08RJ, 08RK]

# R17: the wording's modern treatments (section C.I.6), with ICD-10-PCS prefixes where a
# PCS code shows the treatment. The rest need the bill or the notes; they are not mapped.
modern_treatments:
  - item: Uterine Artery Embolization and HIFU
    icd10pcs: [04LE3DT, 04LF3DU]  # occlusion of the right or left uterine artery
    unmapped: HIFU has no PCS code of its own
  - item: Balloon Sinuplasty
    unmapped: PCS codes the dilation of a sinus without naming the balloon
  - item: Deep Brain Stimulation
    icd10pcs: [00H00MZ, 00H03MZ, 00H04MZ]  # insertion of a neurostimulator lead into the brain
  - item: Oral chemotherapy
    unmapped: a medicine, not a procedure
  - item: Immunotherapy- Monoclonal Antibody to be given as injection
    unmapped: a medicine, not a procedure
  - item: Intra vitreal injections
    icd10pcs: [3E0C3GC]  # other therapeutic substance into the eye, percutaneous
  - item: Robotic surgeries
    icd10pcs: [8E0W0CZ, 8E0W3CZ, 8E0W4CZ, 8E0W7CZ, 8E0W8CZ]  # robotic assistance, trunk
  - item: Stereotactic radio surgeries
    # radiation therapy with modality 2, stereotactic radiosurgery, per body system
    icd10pcs: [D02, D72, D82, D92, DB2, DD2, DF2, DG2, DM2, DT2, DU2, DV2, DW2]
  - item: Bronchical Thermoplasty
    unmapped: PCS codes the destruction of a bronchus without naming the method
  - item: Vaporisation of the prostrate (Green laser treatment or holmium laser treatment)
    unmapped: PCS codes the destruction of the prostate without naming the laser
  - item: IONM - (Intra Operative Neuro Monitoring)
    unmapped: monitoring is coded only when it is the procedure
  - item: Stem cell therapy
    unmapped: no PCS grouping

# R9: standard exclusions that a verified code shows by itself. Exclusions that need more
# than the code (obesity surgery criteria, refractive power, investigation-only stays) are
# left to the medical officer and adjudication.
exclusions:
  - code: Excl07
    title: Change-of-gender treatments
    icd10cm: [F64]
  - code: Excl08
    title: Cosmetic or plastic surgery
    icd10cm: [Z41.1]
  - code: Excl12
    title: Treatment for alcoholism, drug or substance abuse
    icd10cm: [F10-F19]
  - code: Excl17
    title: Sterility and infertility
    icd10cm: [N46, N97, Z31]
  - code: Excl18
    title: Maternity
    # pregnancy and childbirth, except ectopic pregnancy (O00), which the product covers
    icd10cm: [O01-O9A]

clauses:
  premium_received: 64VB
  policy_period: POLICY-PERIOD
  grace_period: GRACE
  insured_person: INSURED
  initial_waiting: Excl03
  sum_insured: SUM-INSURED
  room_cap: ROOM-CAP
  icu_cap: ICU-CAP
  proportionate_deduction: PROP-DED
  co_pay: CO-PAY
  specific_waiting: Excl02
  pre_existing: Excl01
  cataract: CATARACT
  modern_treatments: MODERN-TX
  pre_post: PRE-POST
  ambulance: AMBULANCE
  package_tariff: AGREED-TARIFF
  package_inclusions: PACKAGE-INCL
  non_package_discount: NON-PKG-DISC
  preauth: PREAUTH
  # Non-payable annexure, by IRDAI list number.
  non_payable:
    I: ANNEX-I
    II: ANNEX-II
    III: ANNEX-III
    IV: ANNEX-IV
