# Tool configuration only. The Python project lives in backend/pyproject.toml.
# This file sits at the repo root so pytest, ruff and mypy find it when run
# from here (for example: uv run --project backend pytest tests).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
