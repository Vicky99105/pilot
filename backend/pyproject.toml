[project]
name = "claims-pilot-backend"
version = "0.1.0"
description = "ConsintIQ claims pilot: FastAPI API and Temporal worker"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2",
    "temporalio>=1.35.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false
# Resolve only package versions published at least two weeks before 2026-11-19.
exclude-newer = "2026-11-05T00:00:00Z"
